id = "local.teem"
name = "Teem"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "One visible Foreman with two headless workers and two reviewers"
platforms = ["linux"]

[[build]]
command = ["cargo", "run", "--locked", "--release", "--", "install-plugin"]

[[startup]]
command = ["bin/teem", "service-start"]

[[actions]]
id = "bind"
title = "Teem: bind focused Foreman conversation"
contexts = ["workspace"]
command = ["bin/teem", "bind"]

[[actions]]
id = "start"
title = "Teem: start configured supervisor"
contexts = ["workspace"]
command = ["bin/teem", "service-start"]

[[actions]]
id = "status"
title = "Teem: show task status"
contexts = ["workspace"]
command = ["bin/teem", "open-status"]

[[panes]]
id = "status"
title = "Teem task status"
placement = "popup"
width = "90%"
height = "80%"
command = ["bin/teem", "board"]
