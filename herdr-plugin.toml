id = "local.teem"
name = "TEEM"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "One visible Foreman with two headless workers and two reviewers"
platforms = ["linux"]

[[startup]]
command = ["python3", "foreman_plugin.py", "service-start"]

[[actions]]
id = "bind"
title = "TEEM: bind focused Foreman conversation"
contexts = ["workspace"]
command = ["python3", "foreman_plugin.py", "bind"]

[[actions]]
id = "start"
title = "TEEM: start configured supervisor"
contexts = ["workspace"]
command = ["python3", "foreman_plugin.py", "service-start"]

[[actions]]
id = "status"
title = "TEEM: show task status"
contexts = ["workspace"]
command = ["python3", "foreman_plugin.py", "open-status"]

[[panes]]
id = "status"
title = "TEEM task status"
placement = "popup"
width = "90%"
height = "80%"
command = ["python3", "foreman_plugin.py", "board"]
